site_name: Odoo Code Snippets & Cookbook
site_url: https://lucgril.github.io/odoo-cookbook/
site_description: A collection of Odoo snippets for developers and consultants.
site_author: Luca Grillo
repo_url: https://github.com/Lucgril/odoo-cookbook

theme:
  name: material
  palette:
    primary: deep purple
  features:
    - navigation.tabs
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - "1. ORM & Models": 01_orm_models.md
  - "2. Views & UI": 02_views_ui.md
  - "3. Chatter & Mail": 03_chatter_mail.md
  - "4. Wizards": 04_wizards.md
  - "5. Actions & Cron": 05_actions_cron.md
  - "6. OWL & Frontend": 06_owl_javascript.md
  - "7. Migration & Versions": 07_migration_guides.md
